name: Upload safe-integration
on:
  workflow_dispatch:
  push:
    branches:
      - woof-software/safe-integration

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.WOOF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WOOF_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build site
        run: yarn run build
        env:
          VITE_ANKR_KEY: ${{ vars.WOOF_ANKR_KEY }}
          VITE_V3_WALLET_CONNECT_PROJECT_ID: ${{ vars.WOOF_WALLET_ID }}
          VITE_V3_API_HOST: ${{ vars.VITE_V3_API_HOST }}

      - name: Deploy static site to S3 bucket
        run: aws s3 sync ./dist/ s3://compound-safe-integration/ --delete

      - name: CloudFront invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.WOOF_SAFE_AWS_DISTRIBUTION_ID }} --paths "/*"